version: '2.4'

services:
    server:
        build:
            context: .
        environment:
            NODE_ENV: production
        env_file:
            - .env
        ports:
            - 3000:3000

    minio:
        image: minio/minio:latest
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: miniopassword
        volumes:
            - ./volume:/data
        command: server --address ":9001" --console-address ":9000" /data
        restart: always

networks:                                
    default:                               
        driver: bridge