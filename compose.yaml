
services:
  server:
    image: rtreertree/fluently-forge:latest
    environment:
      NODE_ENV: production
    env_file:
      - .env
    ports:
      - 3000:3000
    restart: always
    depends_on:
      - minio
    networks:
      - minio

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volume:/data
    command: server --address ":9000" --console-address ":9001" /data
    restart: always
    networks:
      - minio

networks:
  minio:
    driver: bridge
